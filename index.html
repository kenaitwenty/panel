<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Kenai</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #222; font-size: 18px; }
    .oculto { display: none !important; }
    .centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .caja { background: white; padding: 2rem; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
            width: 100%; max-width: 420px; }
    h1 { margin: 0 0 1.2rem; font-size: 1.5rem; }
    h2 { margin: 0 0 1rem; font-size: 1.3rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
    input[type=text], input[type=email], input[type=password], input[type=tel], input[type=date] {
      width: 100%; padding: .8rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
    .check { display: flex; gap: .7rem; align-items: flex-start; margin-top: 1.2rem; font-weight: 400; }
    .check input { width: 1.4rem; height: 1.4rem; margin-top: .15rem; flex-shrink: 0; }
    button { width: 100%; padding: 1rem; margin-top: 1.4rem; font-size: 1.1rem; font-weight: 600;
             color: white; background: #1a7f4b; border: 0; border-radius: 10px; cursor: pointer; }
    button:disabled { background: #999; cursor: default; }
    button.gris { background: #e3e6ea; color: #222; margin-top: 0; }
    button.rojo { background: #fff; color: #b00020; border: 1px solid #b00020; margin: 0;
                  width: auto; padding: .45rem .9rem; font-size: .95rem; }
    .error { color: #b00020; margin-top: 1rem; min-height: 1.2rem; }
    header { background: white; padding: 1rem 1.2rem; display: flex; justify-content: space-between;
             align-items: center; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    header strong { font-size: 1.15rem; }
    header button { width: auto; padding: .5rem 1rem; margin: 0; font-size: 1rem; }
    .contenido { max-width: 560px; margin: 1.5rem auto; padding: 0 1rem; }
    .menu { display: grid; gap: 1rem; }
    .menu button { margin: 0; padding: 1.6rem; font-size: 1.3rem; }
    .menu button:disabled { background: #cfd4d9; color: #666; }
    .tarjeta { background: white; border-radius: 12px; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.08);
               margin-bottom: 1rem; }
    .fila { display: flex; justify-content: space-between; align-items: center; gap: .8rem;
            padding: .9rem 0; border-bottom: 1px solid #eee; }
    .fila:last-child { border-bottom: 0; }
    .fila .nombre { font-weight: 600; }
    .fila .tel { color: #666; font-size: .95rem; }
    .badge { display: inline-block; padding: .15rem .6rem; border-radius: 99px; font-size: .85rem; font-weight: 600; }
    .badge.activo { background: #d9f2e3; color: #11613a; }
    .badge.baja { background: #eee; color: #666; }
    .vacio { color: #666; text-align: center; padding: 1rem 0; }
    .resumen { margin-bottom: 1rem; color: #444; }
    
    /* Vista previa WhatsApp */
    .wa-preview { background: #e5ddd5; padding: 1rem; border-radius: 10px; margin-top: 1.2rem; }
    .wa-burbuja { background: #d9fdd3; padding: .8rem 1rem; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.15);
                  font-size: .95rem; line-height: 1.4; color: #111; max-width: 90%; }
    .wa-burbuja strong { display: block; margin-bottom: .3rem; font-size: 1rem; }
    .wa-burbuja .wa-vigencia { display: block; margin-top: .4rem; font-size: .85rem; color: #555; font-style: italic; }
    
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="pantalla-login" class="centro oculto">
    <form id="form-login" class="caja">
      <h1>Panel Kenai</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button id="btn-entrar" type="submit">Entrar</button>
      <div id="error" class="error"></div>
    </form>
  </div>

  <!-- INICIO -->
  <div id="pantalla-inicio" class="oculto">
    <header>
      <strong id="nombre-negocio"></strong>
      <button id="btn-salir" class="gris" type="button">Salir</button>
    </header>
    <div class="contenido">
      <div class="menu">
        <button id="btn-ir-promos" type="button">Mis promos</button>
        <button id="btn-ir-clientes" type="button">Mis clientes</button>
        <button disabled>Mensajes enviados (próximamente)</button>
      </div>
    </div>
  </div>

<!-- MIS PROMOS -->
  <div id="pantalla-lista-promos" class="oculto">
    <header>
      <strong>Mis promos</strong>
      <button id="btn-volver-promos" class="gris" type="button">← Volver</button>
    </header>
    <div class="contenido">
      <div id="resumen-promos" class="resumen"></div>
      <div class="tarjeta" id="contenedor-promos"></div>
      <button id="btn-nueva-promo-flotante" type="button">+ Crear nueva promo</button>
    </div>
  </div>
  
  <!-- MIS CLIENTES -->
  <div id="pantalla-clientes" class="oculto">
    <header>
      <strong>Mis clientes</strong>
      <button id="btn-volver" class="gris" type="button">← Volver</button>
    </header>
    <div class="contenido">
      <div id="resumen" class="resumen"></div>
      <div class="tarjeta" id="lista-clientes"></div>
      <button id="btn-agregar" type="button">+ Agregar cliente</button>
    </div>
  </div>

  <!-- AGREGAR CLIENTE -->
  <div id="pantalla-agregar" class="oculto">
    <header>
      <strong>Agregar cliente</strong>
      <button id="btn-cancelar" class="gris" type="button">Cancelar</button>
    </header>
    <div class="contenido">
      <form id="form-agregar" class="tarjeta">
        <label for="a-nombre">Nombre</label>
        <input id="a-nombre" type="text" required>
        <label for="a-tel">WhatsApp (con código de área, sin 0 y sin 15)</label>
        <input id="a-tel" type="tel" placeholder="Ej: 342 4123456" required>
        <label for="a-cumple">Cumpleaños (opcional)</label>
        <input id="a-cumple" type="date">
        <label class="check">
          <input id="a-ok" type="checkbox" required>
          <span>Confirmo que este cliente aceptó recibir promociones por WhatsApp.</span>
        </label>
        <button id="btn-guardar" type="submit">Guardar cliente</button>
        <div id="error-agregar" class="error"></div>
      </form>
    </div>
  </div>
  
<!-- NUEVA PROMO (ASISTENTE) -->
  <div id="pantalla-promo" class="oculto">
    <header>
      <strong>Nueva promo</strong>
      <button id="btn-cancelar-promo" class="gris" type="button">Cancelar</button>
    </header>
    <div class="contenido">
      <div class="tarjeta">

        <!-- Paso 1 -->
        <div id="paso-1" class="paso-promo">
          <h2>Paso 1 de 4: ¿Qué querés comunicar?</h2>
          <label for="promo-tipo">Tipo de mensaje</label>
          <select id="promo-tipo" style="width: 100%; padding: .8rem; font-size: 1rem; border-radius: 8px; border: 1px solid #bbb;">
            <option value="promo">Promo / Descuento</option>
            <option value="cumple">Regalo de Cumpleaños</option>
            <option value="evento">Evento o Novedad</option>
          </select>
          <button id="btn-paso1-sig" type="button">Siguiente →</button>
        </div>

        <!-- Paso 2 -->
        <div id="paso-2" class="paso-promo oculto">
          <h2>Paso 2 de 4: Mensaje</h2>
          <label for="p-titulo">Título corto</label>
          <input id="p-titulo" type="text" placeholder="Ej: 2x1 en Helados">
          <label for="p-detalle">Detalle</label>
          <input id="p-detalle" type="text" placeholder="Ej: Comprando 1kg te llevás 1/2kg gratis">
          <label for="p-vigencia">Vigencia</label>
          <input id="p-vigencia" type="text" placeholder="Ej: Solo por hoy hasta las 23hs">
          
          <!-- Vista previa en tiempo real -->
          <div class="wa-preview">
            <div class="wa-burbuja">
              <strong id="prev-titulo">Título de tu promo</strong>
              <span id="prev-detalle">Acá vas a ver cómo queda el detalle de la promo a medida que escribís.</span>
              <span id="prev-vigencia" class="wa-vigencia">Vigencia</span>
            </div>
          </div>
          
          <button id="btn-paso2-ant" class="gris" type="button" style="margin-top: 1rem;">← Volver</button>
          <button id="btn-paso2-sig" type="button">Siguiente →</button>
        </div>

        <!-- Paso 3 -->
        <div id="paso-3" class="paso-promo oculto">
          <h2>Paso 3 de 4: Destinatarios</h2>
          <label for="promo-audiencia">¿A quiénes les llega?</label>
          <select id="promo-audiencia" style="width: 100%; padding: .8rem; font-size: 1rem; border-radius: 8px; border: 1px solid #bbb;">
            <option value="todos">A todos mis clientes activos</option>
            <option value="inactivos">A los que no vienen hace 30 días</option>
          </select>
          <button id="btn-paso3-ant" class="gris" type="button" style="margin-top: 1rem;">← Volver</button>
          <button id="btn-paso3-sig" type="button">Siguiente →</button>
        </div>

        <!-- Paso 4 -->
        <div id="paso-4" class="paso-promo oculto">
          <h2>Paso 4 de 4: Envío</h2>
          <label for="promo-cuando">¿Cuándo enviarlo?</label>
          <select id="promo-cuando" style="width: 100%; padding: .8rem; font-size: 1rem; border-radius: 8px; border: 1px solid #bbb;">
            <option value="ahora">Enviar ahora mismo</option>
            <option value="manana">Mañana a las 10:00 hs</option>
          </select>
          <button id="btn-paso4-ant" class="gris" type="button" style="margin-top: 1rem;">← Volver</button>
          <button id="btn-crear-promo" type="button">🚀 Confirmar promo</button>
        </div>

      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    let negocioId = null;

    const PANTALLAS = ['login', 'inicio', 'clientes', 'agregar', 'promo', 'lista-promos'];
    function mostrar(nombre) {
      PANTALLAS.forEach((p) => $('pantalla-' + p).classList.toggle('oculto', p !== nombre));
      window.scrollTo(0, 0);
    }
    function mostrarPaso(num) {
      [1, 2, 3, 4].forEach((n) => $('paso-' + n).classList.toggle('oculto', n !== num));
    }

    // ---------- Inicio ----------
    async function cargarInicio() {
      const { data } = await db.from('negocios').select('id,nombre').limit(1).maybeSingle();
      negocioId = data ? data.id : null;
      $('nombre-negocio').textContent = data ? data.nombre : 'Sin negocio asignado';
      mostrar('inicio');
    }

    // ---------- Teléfono ----------
    function normalizarTelefono(texto) {
      const d = texto.replace(/\D/g, '');
      if (d.startsWith('549') && d.length === 13) return '+' + d;
      if (d.startsWith('54') && d.length === 12) return '+549' + d.slice(2);
      if (d.length === 10) return '+549' + d;
      return null;
    }

    // ---------- Mis clientes ----------
    async function cargarClientes() {
      mostrar('clientes');
      const lista = $('lista-clientes');
      lista.innerHTML = '';
      $('resumen').textContent = 'Cargando...';

      const [c, k] = await Promise.all([
        db.from('clientes').select('id,nombre,telefono').order('nombre'),
        db.from('consentimientos').select('cliente_id,tipo,creado_en').order('creado_en', { ascending: false }),
      ]);
      if (c.error || k.error) {
        $('resumen').textContent = 'No se pudo cargar la lista. Probá de nuevo.';
        return;
      }

      const ultimo = {};
      for (const fila of k.data) {
        if (!(fila.cliente_id in ultimo)) ultimo[fila.cliente_id] = fila.tipo;
      }

      const activos = c.data.filter((x) => ultimo[x.id] === 'alta').length;
      $('resumen').textContent = activos + ' de ' + c.data.length + ' clientes reciben promos.';

      if (c.data.length === 0) {
        const v = document.createElement('div');
        v.className = 'vacio';
        v.textContent = 'Todavía no cargaste clientes.';
        lista.appendChild(v);
        return;
      }

      for (const cli of c.data) {
        const esActivo = ultimo[cli.id] === 'alta';
        const fila = document.createElement('div');
        fila.className = 'fila';

        const izq = document.createElement('div');
        const n = document.createElement('div');
        n.className = 'nombre';
        n.textContent = cli.nombre || 'Sin nombre';
        const t = document.createElement('div');
        t.className = 'tel';
        t.textContent = cli.telefono + ' · ';
        const b = document.createElement('span');
        b.className = 'badge ' + (esActivo ? 'activo' : 'baja');
        b.textContent = esActivo ? 'Activo' : 'De baja';
        t.appendChild(b);
        izq.appendChild(n);
        izq.appendChild(t);
        fila.appendChild(izq);

        if (esActivo) {
          const btn = document.createElement('button');
          btn.className = 'rojo';
          btn.type = 'button';
          btn.textContent = 'Dar de baja';
          btn.addEventListener('click', () => darDeBaja(cli));
          fila.appendChild(btn);
        }
        lista.appendChild(fila);
      }
    }

    async function darDeBaja(cli) {
      if (!confirm('¿Dar de baja a ' + (cli.nombre || cli.telefono) + '? Dejará de recibir promos.')) return;
      const { error } = await db.from('consentimientos').insert({
        negocio_id: negocioId,
        cliente_id: cli.id,
        tipo: 'baja',
        origen: 'manual',
        evidencia: 'Baja cargada por el dueño desde el panel',
      });
      if (error) { alert('No se pudo dar de baja. Probá de nuevo.'); return; }
      await cargarClientes();
    }

// ---------- Mis promos ----------
    async function cargarPromos() {
      mostrar('lista-promos');
      const contenedor = $('contenedor-promos');
      contenedor.innerHTML = '';
      $('resumen-promos').textContent = 'Cargando promos...';

      const { data: campanas, error } = await db
        .from('campanas')
        .select('id,nombre,activa,creado_en')
        .order('creado_en', { ascending: false });

      if (error) {
        $('resumen-promos').textContent = 'Error al cargar promos.';
        return;
      }

      $('resumen-promos').textContent = campanas.length + ' promos registradas.';

      if (campanas.length === 0) {
        const v = document.createElement('div');
        v.className = 'vacio';
        v.textContent = 'Todavía no creaste ninguna promo.';
        contenedor.appendChild(v);
        return;
      }

      for (const camp of campanas) {
        const fila = document.createElement('div');
        fila.className = 'fila';

        const izq = document.createElement('div');
        const n = document.createElement('div');
        n.className = 'nombre';
        n.textContent = camp.nombre || 'Sin título';

        const est = document.createElement('div');
        est.className = 'tel';
        const b = document.createElement('span');
        b.className = 'badge ' + (camp.activa ? 'activo' : 'baja');
        b.textContent = camp.activa ? 'Activa' : 'Pausada';
        est.appendChild(b);

        izq.appendChild(n);
        izq.appendChild(est);
        fila.appendChild(izq);

        const btnPausar = document.createElement('button');
        btnPausar.className = camp.activa ? 'rojo' : 'gris';
        btnPausar.style.width = 'auto';
        btnPausar.style.padding = '.45rem .9rem';
        btnPausar.style.fontSize = '.95rem';
        btnPausar.type = 'button';
        btnPausar.textContent = camp.activa ? 'Pausar' : 'Activar';
        btnPausar.addEventListener('click', async () => {
          await db.from('campanas').update({ activa: !camp.activa }).eq('id', camp.id);
          await cargarPromos();
        });

        // Contenedor para agrupar los botones a la derecha
        const acciones = document.createElement('div');
        acciones.style.display = 'flex';
        acciones.style.gap = '.5rem';

        // Botón Eliminar
        const btnBorrar = document.createElement('button');
        btnBorrar.className = 'rojo';
        btnBorrar.style.width = 'auto';
        btnBorrar.style.padding = '.45rem .8rem';
        btnBorrar.style.fontSize = '.9rem';
        btnBorrar.type = 'button';
        btnBorrar.textContent = '🗑️';
        btnBorrar.title = 'Eliminar promo';
        btnBorrar.addEventListener('click', async () => {
          if (!confirm('¿Eliminar definitivamente la promo "' + (camp.nombre || 'esta promo') + '"?')) return;
          const { error: errBorrar } = await db.from('campanas').delete().eq('id', camp.id);
          if (errBorrar) {
            alert('No se pudo eliminar la promo. Probá de nuevo.');
            return;
          }
          await cargarPromos();
        });

        acciones.appendChild(btnPausar);
        acciones.appendChild(btnBorrar);
        fila.appendChild(acciones);
        contenedor.appendChild(fila);
      }
    }
    
    // ---------- Agregar cliente ----------
    $('btn-agregar').addEventListener('click', () => {
      $('form-agregar').reset();
      $('error-agregar').textContent = '';
      mostrar('agregar');
    });
    $('btn-cancelar').addEventListener('click', () => mostrar('clientes'));

    $('form-agregar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('error-agregar');
      err.textContent = '';

      const tel = normalizarTelefono($('a-tel').value);
      if (!tel) {
        err.textContent = 'Revisá el número: código de área + número, sin 0 y sin 15. Ej: 342 4123456';
        return;
      }

      $('btn-guardar').disabled = true;
      const { data: cli, error: e1 } = await db.from('clientes').insert({
        negocio_id: negocioId,
        telefono: tel,
        nombre: $('a-nombre').value.trim(),
        fecha_nacimiento: $('a-cumple').value || null,
      }).select('id').single();

      if (e1) {
        $('btn-guardar').disabled = false;
        err.textContent = e1.code === '23505' ? 'Ese número ya está cargado.' : 'No se pudo guardar. Probá de nuevo.';
        return;
      }

      const { error: e2 } = await db.from('consentimientos').insert({
        negocio_id: negocioId,
        cliente_id: cli.id,
        tipo: 'alta',
        origen: 'manual',
        evidencia: 'Alta cargada por el dueño desde el panel',
      });
      $('btn-guardar').disabled = false;

      if (e2) {
        err.textContent = 'El cliente se guardó pero falló el registro de su aceptación. Avisá a soporte.';
        return;
      }
      await cargarClientes();
    });

    // ---------- Login / salir ----------
    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      $('btn-entrar').disabled = true;
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('clave').value,
      });
      $('btn-entrar').disabled = false;
      if (error) { $('error').textContent = 'Email o contraseña incorrectos.'; return; }
      $('clave').value = '';
      await cargarInicio();
    });

    $('btn-salir').addEventListener('click', async () => {
      await db.auth.signOut();
      negocioId = null;
      mostrar('login');
    });
    $('btn-ir-clientes').addEventListener('click', cargarClientes);
    $('btn-volver').addEventListener('click', () => mostrar('inicio'));
        // Navegación de Nueva Promo
    $('btn-ir-promos').addEventListener('click', cargarPromos);
    $('btn-volver-promos').addEventListener('click', () => mostrar('inicio'));
    $('btn-nueva-promo-flotante').addEventListener('click', () => {
      mostrarPaso(1);
      mostrar('promo');
    });
    $('btn-cancelar-promo').addEventListener('click', () => mostrar('lista-promos'));
    
    // Botones del asistente
    $('btn-paso1-sig').addEventListener('click', () => mostrarPaso(2));
    $('btn-paso2-ant').addEventListener('click', () => mostrarPaso(1));
    $('btn-paso2-sig').addEventListener('click', () => mostrarPaso(3));
    $('btn-paso3-ant').addEventListener('click', () => mostrarPaso(2));
    $('btn-paso3-sig').addEventListener('click', () => mostrarPaso(4));
    $('btn-paso4-ant').addEventListener('click', () => mostrarPaso(3));

        // Actualizar la vista previa tipo WhatsApp en vivo
    function actualizarPreview() {
      $('prev-titulo').textContent = $('p-titulo').value.trim() || 'Título de tu promo';
      $('prev-detalle').textContent = $('p-detalle').value.trim() || 'Acá vas a ver cómo queda el detalle de la promo a medida que escribís.';
      $('prev-vigencia').textContent = $('p-vigencia').value.trim() || 'Vigencia';
    }
    $('p-titulo').addEventListener('input', actualizarPreview);
    $('p-detalle').addEventListener('input', actualizarPreview);
    $('p-vigencia').addEventListener('input', actualizarPreview);
    
    // ---------- Guardar Campaña en Supabase ----------
    $('btn-crear-promo').addEventListener('click', async () => {
      const titulo = $('p-titulo').value.trim();
      const detalle = $('p-detalle').value.trim();
      const vigencia = $('p-vigencia').value.trim();

      if (!titulo || !detalle) {
        alert('Por favor completá al menos el título y el detalle de la promo.');
        mostrarPaso(2);
        return;
      }

      const btn = $('btn-crear-promo');
      btn.disabled = true;
      btn.textContent = 'Guardando promo...';

      try {
        // 1. Obtener o crear la plantilla base para este negocio
        let { data: plantilla } = await db
          .from('plantillas')
          .select('id')
          .eq('negocio_id', negocioId)
          .limit(1)
          .maybeSingle();

        if (!plantilla) {
          const { data: nuevaPlantilla, error: errP } = await db
            .from('plantillas')
            .insert({
              negocio_id: negocioId,
              nombre_meta: 'promo_generica',
              idioma: 'es_AR',
              categoria: 'MARKETING',
              variables: ['titulo', 'detalle', 'vigencia']
            })
            .select('id')
            .single();

          if (errP) throw errP;
          plantilla = nuevaPlantilla;
        }

        // 2. Armar el disparador según lo elegido
        const tipoEnvio = $('promo-cuando').value;
        const ahora = new Date();
        let disparador = {};

        if (tipoEnvio === 'ahora') {
          // Fecha local en formato YYYY-MM-DD
          const anio = ahora.getFullYear();
          const mes = String(ahora.getMonth() + 1).padStart(2, '0');
          const dia = String(ahora.getDate()).padStart(2, '0');
          const fechaStr = `${anio}-${mes}-${dia}`;

          // Hora local HH:MM
          const horaStr = ahora.toTimeString().slice(0, 5);
          disparador = { tipo: 'fecha', fecha: fechaStr, hora: horaStr };
        } else {
          // Mañana local
          const manana = new Date(ahora);
          manana.setDate(manana.getDate() + 1);
          const anio = manana.getFullYear();
          const mes = String(manana.getMonth() + 1).padStart(2, '0');
          const dia = String(manana.getDate()).padStart(2, '0');
          const fechaStr = `${anio}-${mes}-${dia}`;
          disparador = { tipo: 'fecha', fecha: fechaStr, hora: '10:00' };
        }

        // 3. Guardar la campaña
        const { error: errCampana } = await db.from('campanas').insert({
          negocio_id: negocioId,
          plantilla_id: plantilla.id,
          nombre: titulo,
          variables: { titulo, detalle, vigencia },
          disparador: disparador,
          audiencia: { tipo: $('promo-audiencia').value },
          activa: true,
          vigente_desde: ahora.toISOString().split('T')[0]
        });

        if (errCampana) throw errCampana;

        alert('¡Promo creada con éxito!');
        // Limpiamos los campos y volvemos al inicio
        $('p-titulo').value = '';
        $('p-detalle').value = '';
        $('p-vigencia').value = '';
        actualizarPreview();
        await cargarPromos();

      } catch (err) {
        console.error(err);
        alert('Hubo un error al guardar la promo. Revisá la consola.');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Confirmar promo';
      }
    });

    (async () => {
      const { data } = await db.auth.getSession();
      if (data.session) await cargarInicio();
      else mostrar('login');
    })();
  </script>
</body>
</html>
